<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Study Buddy — your personal academic learning platform." />
    <title>Study Buddy — Your Personal Academic Learning Platform</title>

    <!-- DNS prefetch & preconnect for fastest network handshake -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://study-buddy-91gv.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://study-buddy-91gv.onrender.com" />

    <!-- Google Fonts loaded non-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
    />

    <script>
      // Apply the saved theme before the app loads so dark mode never flashes light.
      (function () {
        try {
          var mode = localStorage.getItem('studyBuddyTheme');
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* storage unavailable */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
